  tcp_link: 12                                                                                  # The index of the tcp link
  tcp_height: 0.15                                                                              # The height of the tcp link
  
# TODO
# Camera params
Camera:
  L515:
    dev_name: "L515"
    fov: 69             # Field of View
    width: 1280          # width
    height: 720         # height
    depth_width: 1024
    depth_height: 768
    nearVal: 0.1        # Camera near viewing distance
    farVal: 10          # Camera far viewing distance
    head_tilt: 0.0
    min_depth: 0.01      # Minimum depth of point cloud
    max_depth: 2.0     # Maximum depth of point cloud
    fps: 30

    # 工作空间裁剪参数
    xmin: -0.19
    xmax:  0.12
    ymin: -0.15
    ymax:  0.15
    zmin:  0.0
    zmax:  1.0

  D435I:
    dev_name: "D435I"
    fov: 69             # Field of View
    width: 640          # width
    height: 480         # height
    depth_width: 640
    depth_height: 480
    nearVal: 0.1        # Camera near viewing distance
    farVal: 10          # Camera far viewing distance
    head_tilt: 0.0
    min_depth: 0.01      # Minimum depth of point cloud
    max_depth: 2.0     # Maximum depth of point cloud
    fps: 30

    # 工作空间裁剪参数
    xmin: -0.19
    xmax:  0.12
    ymin: -0.15
    ymax:  0.15
    zmin:  0.0
    zmax:  1.0
    
  init_delay: 3       # Initialization delay time in seconds
  
# TODO
Grasp_Pose_Estimation:
  AnyGrasp:
    checkpoint_path: "./checkpoints/checkpoint_detection.tar" # Model checkpoint path
    max_gripper_width: 0.08  # Maximum gripper width
    gripper_height: 0.03   # Gripper height
    debug: True # Enable visualization
    sampling_rate: 1.0  # Sampling rate of points [<= 1]
    top_down_grasp: true  # top_down_grasp
    output_dir: "output/test"

